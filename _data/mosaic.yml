# Hero background mosaic (the tilted scrolling rows behind the intro).
#
# Edit this visually: run the site locally, open /_mosaic_editor.html, drag the
# dropdowns until it looks right, then paste its "grid:" output over the block
# below. Each row maps to a reel (a-f), top to bottom. A row loops after its
# listed tiles, so the tiles you list are one full loop.
#
# Names are files in /assets/images/mosaic/ without the .webp.
# Available: adptiv splat2 pluck drawer quadstick cabin-boy expiry upstart
#            inside-voice s1 s2 s3 z1 z2 z3 particle1 particle2 particle3

grid:
  - [adptiv, splat2, pluck, drawer]
  - [splat2, cabin-boy, z1, quadstick]
  - ["/assets/images/gif.gif", particle1, "/assets/images/particle2.gif", particle2]
  - [quadstick, pluck, "/assets/images/drawer-logo.png", "/assets/images/expiry-showcase-card.webp"]
  - [quadstick, cabin-boy, expiry, inside-voice]
  - [cabin-boy, expiry, upstart, adptiv]
