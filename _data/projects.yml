  description: "AI fitness coach that uses on-device pose estimation to read exercise form. I took the ML models from training all the way to deployment on phones."
  tech: ["Python", "TF Lite", "PyTorch"]
  badge:
    type: award
    icon: "fas fa-trophy"
    text: "Spark Tank 2.1 Winner"
  media:
    type: image
    webp: "/assets/images/adptiv-ai-card.webp"
    png: "/assets/images/adptiv-ai-card.jpg"
    width: 1000
    height: 625
    alt: "Adptiv AI app home screen"

