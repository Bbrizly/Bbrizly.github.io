# Homepage project cards, rendered in the order they appear in this file.
# To reorder projects, move whole entries up or down. To add a project,
# copy an entry and edit the fields.
#
# Fields:
#   title        Card heading (required)
#   date         Small date shown next to the title, e.g. "2024" or "2025 - Present"
#   url          Where the card links. Omit for a non-clickable card.
#   external     true = opens in a new tab with the little arrow icon
#   tags         Filter chips this card belongs to, space-separated.
#                Valid: games-graphics, ai-ml, accessibility, mobile-web, shipped
#   description  One- or two-sentence summary
#   tech         List of tech pills
#   badge        Optional. type: award (gold trophy) or ship (green). icon is a
#                Font Awesome class.
#   media        What shows at the top of the card. One of three types:
#                  type: video  -> src (mp4), poster (still), aria (label)
#                  type: image  -> webp, png (fallback), width, height, alt
#                  type: stack  -> color (games/accessibility/ai/mobile),
#                                  name (big text on the tile, defaults to title)

- title: "Adptiv AI"
