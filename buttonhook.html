<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- ponytail: GitHub Pages is static, so a full bleed iframe is the only way
         to serve buttonhook.pages.dev here without a redirect. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Buttonhook</title>

    <link rel="apple-touch-icon" href="https://buttonhook.pages.dev/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:type" content="website" />

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #15181c;

      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;

        display: block;

  <body>
